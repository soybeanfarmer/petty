name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify toolchain, formatting, types, build, and tests
        run: npm run check
      - name: Export structural contract schemas
        run: npm run schemas:export
      - name: Ensure checks leave the checkout unchanged
        run: git diff --exit-code

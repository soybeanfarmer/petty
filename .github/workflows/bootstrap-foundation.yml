name: Bootstrap foundation

on:
  push:
    branches:
      - build/m02-foundation

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Generate npm lockfile and install development tooling
        run: npm install --ignore-scripts
      - name: Normalize repository formatting
        run: npm run format
      - name: Return generated source and lockfile
        run: node scripts/bootstrap-foundation.mjs
      - name: Verify foundation
        run: npm run check
